name: PikaDex CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run canonical release verification
        id: verification
        env:
          PIKADEX_RELEASE_BUILD_ROOT: ${{ runner.temp }}/PikaDex-A2
          PIKADEX_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
        run: Scripts/pokedex-release-verification

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pikadex-a2-verification
          path: ${{ runner.temp }}/PikaDex-A2/evidence/
          if-no-files-found: error
          retention-days: 14
