name: PikaDex CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Xcode 27.2
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.2"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 27B52"
          xcrun swift --version

      - name: Run release verifier Python tests
        run: python3 -m unittest Scripts.tests.test_release_verification_inventory

      - name: Run canonical release verification
        id: verification
        env:
          PIKADEX_RELEASE_BUILD_ROOT: ${{ runner.temp }}/PikaDex-A2
          PIKADEX_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
        run: Scripts/pokedex-release-verification

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pikadex-a2-verification
          path: ${{ runner.temp }}/PikaDex-A2/evidence/
          if-no-files-found: error
          retention-days: 14
