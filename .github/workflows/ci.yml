name: PikaDex CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulator_lifecycle_diagnostics:
        description: Run the guarded simulator lifecycle diagnostic mode
        required: false
        type: boolean
        default: false
      tested_source_sha:
        description: Exact PikaDex source revision to test in diagnostic mode
        required: false
        type: string
      expected_workflow_sha:
        description: Exact workflow-definition revision for this dispatch
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Guard diagnostic dispatch identity
        if: ${{ inputs.simulator_lifecycle_diagnostics == true }}
        env:
          DIAGNOSTIC_MODE: ${{ inputs.simulator_lifecycle_diagnostics }}
          TESTED_SOURCE_SHA: ${{ inputs.tested_source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = danielbyon/PikaDex
          test "$GITHUB_REF" = refs/heads/codex/issue-45-instrumented-ci
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
          test "$DIAGNOSTIC_MODE" = true
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$TESTED_SOURCE_SHA" = c579ebb54c41deeb08dc67060d7ec675f8b05d77
          {
            printf 'PIKADEX_DIAGNOSTIC_MODE=true\n'
            printf 'PIKADEX_TESTED_SOURCE_SHA=%s\n' "$TESTED_SOURCE_SHA"
            printf 'PIKADEX_EXPECTED_SOURCE_TREE_SHA=484e25af84ffa1c8d0ac72527036f78d24f21e84\n'
            printf 'PIKADEX_EXPECTED_WORKFLOW_SHA=%s\n' "$EXPECTED_WORKFLOW_SHA"
            printf 'PIKADEX_WORKFLOW_SHA=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'PIKADEX_WORKFLOW_REF=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'PIKADEX_EVENT_NAME=%s\n' "$GITHUB_EVENT_NAME"
          } >> "$GITHUB_ENV"

      - name: Check out source
        if: ${{ inputs.simulator_lifecycle_diagnostics != true }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out guarded diagnostic source
        if: ${{ inputs.simulator_lifecycle_diagnostics == true }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_source_sha }}
          fetch-depth: 1

      - name: Verify guarded diagnostic source identity
        if: ${{ inputs.simulator_lifecycle_diagnostics == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PIKADEX_TESTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = 484e25af84ffa1c8d0ac72527036f78d24f21e84

      - name: Verify Xcode 27.2
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.2"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 27B52"
          xcrun swift --version

      - name: Run release verifier Python tests
        run: |
          python3 -m unittest \
            Scripts.tests.test_release_verification_inventory \
            Scripts.tests.test_capture_enumeration_xcresult

      - name: Run canonical release verification
        id: verification
        env:
          PIKADEX_RELEASE_BUILD_ROOT: "${{ runner.temp }}/PikaDex-A2"
          PIKADEX_SIMULATOR_DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=27.0"
          PIKADEX_SIMULATOR_LIFECYCLE_DIAGNOSTICS: "${{ inputs.simulator_lifecycle_diagnostics }}"
          PIKADEX_TESTED_SOURCE_SHA: "${{ inputs.tested_source_sha }}"
          PIKADEX_WORKFLOW_DEFINITION_SHA: "${{ github.workflow_sha }}"
        run: |
          set +e
          lifecycle_enabled="$PIKADEX_SIMULATOR_LIFECYCLE_DIAGNOSTICS"
          lifecycle_dir="$RUNNER_TEMP/PikaDex-Simulator-Lifecycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          lifecycle_token="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$$-$RANDOM"
          lifecycle_sampler_pid=""
          lifecycle_marker_written=0
          observer_marker_written=0
          lifecycle_sampler_waited=0
          verifier_pid=0
          verifier_status=-1
          observer_pid=0
          observer_status=-1
          shell_exit_status=-1
          lifecycle_sampler_wait_limit_seconds=5

          write_completion() {
            completion_state="$1"
            if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ] && [ "$lifecycle_marker_written" -eq 0 ]; then
              completion_record="$(printf '{"token":"%s","state":"%s","verifier_pid":%s,"verifier_status":%s,"observer_pid":%s,"observer_status":%s,"shell_exit_status":%s}\n' "$lifecycle_token" "$completion_state" "$verifier_pid" "$verifier_status" "$observer_pid" "$observer_status" "$shell_exit_status")"
              if printf '%s\n' "$completion_record" > "$lifecycle_dir/verifier-completion.json.tmp" && mv "$lifecycle_dir/verifier-completion.json.tmp" "$lifecycle_dir/verifier-completion.json"; then
                lifecycle_marker_written=1
              elif printf '%s\n' "$completion_record" > "$lifecycle_dir/verifier-completion.json"; then
                lifecycle_marker_written=1
                printf '::warning::Atomic verifier completion publication failed; direct fallback record was written.\n'
              elif : > "$lifecycle_dir/verifier-completion.json"; then
                lifecycle_marker_written=1
                printf '::warning::Verifier completion payload could not be written; invalid-marker finalization will bound the sampler.\n'
              else
                printf '::warning::Verifier completion marker could not be created; lifecycle capture may reach its hard limit.\n'
              fi
            fi
          }

          write_observer_completion() {
            observer_completion_state="$1"
            if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ] && [ "$observer_marker_written" -eq 0 ]; then
              if printf '{"token":"%s","state":"%s","verifier_pid":%s,"verifier_status":%s,"observer_pid":%s,"observer_status":%s}\n' "$lifecycle_token" "$observer_completion_state" "$verifier_pid" "$verifier_status" "$observer_pid" "$observer_status" > "$lifecycle_dir/observer-completion.json.tmp" && mv "$lifecycle_dir/observer-completion.json.tmp" "$lifecycle_dir/observer-completion.json"; then
                observer_marker_written=1
              fi
            fi
          }

          finalize_lifecycle_sampler() {
            lifecycle_sampler_waited=1
            lifecycle_sampler_status=124
            termination_state="unverified"
            termination_reason="owner_wait_pending"
            wait_started_seconds=$SECONDS
            printf '{"termination":"unverified","wait_status":null,"pid":%s,"wait_limit_seconds":%s,"reason":"owner_wait_pending"}\n' "$lifecycle_sampler_pid" "$lifecycle_sampler_wait_limit_seconds" > "$lifecycle_dir/termination-evidence.json"
            while kill -0 "$lifecycle_sampler_pid" 2>/dev/null; do
              wait_elapsed_seconds=$((SECONDS - wait_started_seconds))
              if [ "$wait_elapsed_seconds" -ge "$lifecycle_sampler_wait_limit_seconds" ]; then
                termination_reason="owner_wait_deadline_exceeded"
                break
              fi
              sleep 0.1
            done
            if [ "$termination_reason" = "owner_wait_pending" ]; then
              wait "$lifecycle_sampler_pid"
              lifecycle_sampler_status=$?
              if [ "$lifecycle_sampler_status" -eq 127 ]; then
                termination_reason="direct_child_wait_status_unavailable"
              else
                termination_state="verified_stopped"
                termination_reason="direct_child_wait_completed"
              fi
            fi
            if [ "$termination_reason" = "owner_wait_deadline_exceeded" ]; then
              printf '{"termination":"unverified","wait_status":null,"owner_wait_outcome":"timed_out","pid":%s,"wait_limit_seconds":%s,"reason":"%s"}\n' "$lifecycle_sampler_pid" "$lifecycle_sampler_wait_limit_seconds" "$termination_reason" > "$lifecycle_dir/termination-evidence.json"
              printf '::warning::Lifecycle sampler did not stop within the bounded owner wait; termination is unverified and canonical verification will continue.\n'
              printf '{"state":"incomplete","reason":"owner_wait_deadline_exceeded","wait_limit_seconds":%s}\n' "$lifecycle_sampler_wait_limit_seconds" > "$lifecycle_dir/finalization-status.json"
            elif [ "$lifecycle_sampler_status" -ne 0 ]; then
              printf '{"termination":"%s","wait_status":%s,"owner_wait_outcome":"completed","pid":%s,"wait_limit_seconds":%s,"reason":"%s"}\n' "$termination_state" "$lifecycle_sampler_status" "$lifecycle_sampler_pid" "$lifecycle_sampler_wait_limit_seconds" "$termination_reason" > "$lifecycle_dir/termination-evidence.json"
              printf '::warning::Lifecycle sampler exited with status %s; diagnostic capture may be incomplete.\n' "$lifecycle_sampler_status"
              printf '{"state":"incomplete","reason":"sampler_exit_status","exit_status":%s}\n' "$lifecycle_sampler_status" > "$lifecycle_dir/finalization-status.json"
            else
              printf '{"termination":"%s","wait_status":%s,"owner_wait_outcome":"completed","pid":%s,"wait_limit_seconds":%s,"reason":"%s"}\n' "$termination_state" "$lifecycle_sampler_status" "$lifecycle_sampler_pid" "$lifecycle_sampler_wait_limit_seconds" "$termination_reason" > "$lifecycle_dir/termination-evidence.json"
            fi
          }

          # shellcheck disable=SC2329
          finish_on_exit() {
            saved_status=$?
            trap - EXIT
            if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ] && [ "$lifecycle_sampler_waited" -eq 0 ]; then
              shell_exit_status=$saved_status
              write_completion "shell_exit"
              if [ "$observer_pid" -gt 1 ] && [ "$observer_status" -eq -1 ]; then
                write_observer_completion "owner_shell_exited_before_observer_completion"
              fi
              finalize_lifecycle_sampler
            fi
            return "$saved_status"
          }

          if [ "$lifecycle_enabled" = "true" ]; then
            provenance_limit_bytes=1048576
            export PIKADEX_DIAGNOSTIC_PROVENANCE_LIMIT_BYTES="$provenance_limit_bytes"
            export PIKADEX_DIAGNOSTIC_SAMPLER_WAIT_LIMIT_SECONDS="$lifecycle_sampler_wait_limit_seconds"
            trap finish_on_exit EXIT
            trap 'exit 143' TERM
            trap 'exit 130' INT
            trap 'exit 129' HUP
            if mkdir -m 700 "$lifecycle_dir"; then
              python3 -u - "$lifecycle_dir" "$PIKADEX_RELEASE_BUILD_ROOT" "$lifecycle_token" <<'PY_LIFECYCLE' >/dev/null 2>&1 &
          import datetime
          import json
          import os
          import pathlib
          import re
          import signal
          import stat
          import subprocess
          import sys
          import time
          from Scripts.capture_enumeration_xcresult import CaptureProblem, _read_gate_exit

          run_dir, build_root, token = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          gate_marker_path = build_root / "evidence" / "logs" / "enumerate_Modules.exit"
          completion_path = run_dir / "verifier-completion.json"
          start_path = run_dir / "verification-start.json"
          sample_path = run_dir / "process-samples.ndjson"
          canceled = {"signal": None}
          def utc_now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds")
          def write_json(path, value):
              temporary = path.with_name(path.name + ".tmp")
              temporary.write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
              os.replace(temporary, path)
          def on_signal(signum, _frame):
              canceled["signal"] = signum
          def read_json(path, limit=1048576):
              try:
                  if path.is_symlink() or not path.is_file() or path.stat().st_size > limit:
                      return None
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return None
          def read_json_state(path, limit):
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return "absent", None
              except OSError:
                  return "invalid", None
              if not stat.S_ISREG(info.st_mode) or info.st_size > limit:
                  return "invalid", None
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return "invalid", None
              return ("valid", value) if isinstance(value, dict) else ("invalid", None)
          signal.signal(signal.SIGTERM, on_signal)
          signal.signal(signal.SIGINT, on_signal)

          write_json(
              run_dir / "run-metadata.json",
              {
                  "schema_version": 1,
                  "event_type": os.environ.get("GITHUB_EVENT_NAME"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "workflow_definition_revision": os.environ.get("PIKADEX_WORKFLOW_DEFINITION_SHA"),
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
                  "tested_source_revision": os.environ.get("PIKADEX_TESTED_SOURCE_SHA"),
                  "runner": {"name": os.environ.get("RUNNER_NAME"), "os": os.environ.get("RUNNER_OS"), "arch": os.environ.get("RUNNER_ARCH")},
                  "simulator_destination": os.environ.get("PIKADEX_SIMULATOR_DESTINATION"),
                  "canonical_provenance_path": str(build_root / "evidence" / "provenance.json"),
                  "started_at_utc": utc_now(),
              },
          )
          process_table_interval_seconds = 1
          resource_sample_interval_seconds = 10
          process_identity_limit = 64
          probe_timeout_seconds = 2
          post_gate_capture_seconds = 300
          observer_finalization_limit_seconds = 90
          observer_hard_limit_seconds = 5400
          owner_sampler_wait_limit_seconds = int(os.environ["PIKADEX_DIAGNOSTIC_SAMPLER_WAIT_LIMIT_SECONDS"])
          aggregate_limit_bytes = 201326592
          metadata_limit_bytes = 1048576
          provenance_limit_bytes = int(os.environ["PIKADEX_DIAGNOSTIC_PROVENANCE_LIMIT_BYTES"])
          finalization_reserve_bytes = 16384
          sample_limit_bytes = aggregate_limit_bytes - metadata_limit_bytes - provenance_limit_bytes - finalization_reserve_bytes
          policy = {
              "schema_version": 1,
              "process_table_interval_seconds": process_table_interval_seconds,
              "resource_sample_interval_seconds": resource_sample_interval_seconds,
              "process_identity_limit": process_identity_limit,
              "probe_timeout_seconds": probe_timeout_seconds,
              "post_gate_capture_seconds": post_gate_capture_seconds,
              "owner_sampler_wait_limit_seconds": owner_sampler_wait_limit_seconds,
              "owner_sampler_wait_deadline_granularity_seconds": 1,
              "sampler_timeout_action": "Do not signal the sampler. Report termination as unverified and return the verifier's exit status. The sampler exits at its 5400-second hard limit.",
              "observer_finalization_limit_seconds": observer_finalization_limit_seconds,
              "observer_hard_limit_seconds": observer_hard_limit_seconds,
              "aggregate_retained_limit_bytes": aggregate_limit_bytes,
              "metadata_output_limit_bytes": metadata_limit_bytes,
              "canonical_provenance_limit_bytes": provenance_limit_bytes,
              "sample_output_limit_bytes": sample_limit_bytes,
              "finalization_reserve_bytes": finalization_reserve_bytes,
              "signals_sent": False,
              "process_group_control": False,
              "heartbeat_liveness_failure": False,
              "native_result_exports": False,
              "unified_log_query": "Query from 30 seconds before the first observed Modules marker through 30 seconds after completion, with the gate interval capped at five minutes. Include info and debug messages. Use the configured 60-minute range when no start timestamp is available.",
              "observation_limits": "Host logs and process/resource samples cannot identify who requested simulator shutdown, whether the simulator released its launch-session claim, or which daemon transition initiated it.",
              "gate_source": str(gate_marker_path),
          }
          write_json(run_dir / "capture-policy.json", policy)
          write_json(run_dir / "observer-ready.json", {"token": token, "ready_at_utc": utc_now()})

          pattern = re.compile(r"xcodebuild|xctest|xctrunner|testmanagerd|simulator|coresimulator|launchd_sim|simctl|pokedex-release|pikadex|dtservicehub", re.I)
          started = time.monotonic()
          hard_deadline = started + observer_hard_limit_seconds
          next_sample = started
          next_resource = started
          post_gate_deadline = None
          gate_marker_observed = False
          gate_state = "not_started"
          gate_first_observed_at_utc = None
          gate_completed_observed_at_utc = None
          gate_exit_code = None
          gate_marker_error = None
          sample_count = 0
          probe_errors = 0
          output_bytes = 0
          invalid_marker_at = None
          stop_reason = "observer_running"
          state = "complete"
          def retained_file_bytes():
              total = 0
              for path in run_dir.iterdir():
                  if path.is_symlink():
                      raise RuntimeError("diagnostic_symlink_detected")
                  if path.is_file():
                      total += path.stat().st_size
              return total
          try:
              with sample_path.open("w", encoding="utf-8") as samples:
                  while True:
                      now = time.monotonic()
                      if canceled["signal"] is not None:
                          state, stop_reason = "cancelled", "signal_" + str(canceled["signal"])
                          break
                      if gate_exit_code is None:
                          try:
                              marker_state, marker_code = _read_gate_exit(build_root, retry_seconds=0.5)
                              if marker_state == "in_progress":
                                  if not gate_marker_observed:
                                      gate_first_observed_at_utc = utc_now()
                                  gate_marker_observed, gate_state = True, "gate_in_progress"
                                  gate_marker_error = None
                              elif marker_state == "completed" and marker_code is not None:
                                  if not gate_marker_observed:
                                      gate_first_observed_at_utc = utc_now()
                                  gate_completed_observed_at_utc = utc_now()
                                  gate_marker_observed, gate_state = True, "gate_completed"
                                  gate_exit_code, post_gate_deadline = marker_code, now + post_gate_capture_seconds
                                  gate_marker_error = None
                              elif marker_state == "not_run":
                                  if gate_marker_observed:
                                      gate_state = "gate_marker_disappeared"
                                      gate_marker_error = "gate marker became absent after it was observed"
                                  else:
                                      gate_state, gate_marker_error = "not_started", None
                          except CaptureProblem as error:
                              gate_state, gate_marker_error = "gate_marker_invalid", str(error)[:160]
                      completion_read_state, completion = read_json_state(completion_path, 16384)
                      if completion_read_state == "absent":
                          invalid_marker_at = None
                      elif completion_read_state == "invalid":
                          invalid_marker_at = now if invalid_marker_at is None else invalid_marker_at
                          if now - invalid_marker_at >= observer_finalization_limit_seconds:
                              state, stop_reason = "incomplete", "completion_signal_invalid_after_90_seconds"
                              break
                      elif completion_read_state == "valid":
                          start = read_json(start_path, 16384)
                          completion_identity_valid = (
                              completion.get("token") == token
                              and completion.get("state") in ("verifier_completed", "shell_exit")
                              and isinstance(completion.get("verifier_pid"), int)
                              and completion.get("verifier_pid", 0) > 1
                          )
                          if completion_identity_valid:
                              if completion.get("state") == "shell_exit":
                                  state, stop_reason = "incomplete", "owner_shell_exited_before_verifier_completion"
                                  break
                              if not (
                                  isinstance(start, dict)
                                  and start.get("token") == token
                                  and start.get("verifier_pid") == completion.get("verifier_pid")
                              ):
                                  state, stop_reason = "incomplete", "completion_start_identity_mismatch"
                                  break
                              if gate_exit_code is None and gate_state == "not_started":
                                  gate_state = "gate_not_reached"
                              elif gate_exit_code is None and gate_state == "gate_in_progress":
                                  gate_state = "gate_incomplete"
                              stop_reason = "verifier_completed_before_post_gate_window" if post_gate_deadline and now < post_gate_deadline else "verifier_completed"
                              break
                          invalid_marker_at = now if invalid_marker_at is None else invalid_marker_at
                          if now - invalid_marker_at >= observer_finalization_limit_seconds:
                              state, stop_reason = "incomplete", "completion_signal_invalid_after_90_seconds"
                              break
                      if post_gate_deadline is not None and now >= post_gate_deadline:
                          stop_reason = "five_minute_post_gate_window_complete"
                          break
                      if now >= hard_deadline:
                          state, stop_reason = "incomplete", "observer_max_runtime_reached"
                          break
                      if now >= next_sample:
                          resource_sample = now >= next_resource
                          try:
                              result = subprocess.run(
                                  ["ps", "-Ao", "pid=,ppid=,sess=,pgid=,uid=,etime=,%cpu=,%mem=,rss=,comm="],
                                  capture_output=True, text=True, timeout=probe_timeout_seconds, check=False,
                              )
                              if result.returncode:
                                  raise RuntimeError("ps_exit_" + str(result.returncode))
                              processes = []
                              truncated = False
                              for line in result.stdout.splitlines():
                                  columns = line.strip().split(None, 9)
                                  if len(columns) < 10 or not pattern.search(columns[9]):
                                      continue
                                  if len(processes) == process_identity_limit:
                                      truncated = True
                                      break
                                  item = {
                                      "pid": columns[0], "ppid": columns[1], "session_id": columns[2],
                                      "process_group_id": columns[3], "uid": columns[4], "elapsed": columns[5],
                                      "name": columns[9],
                                  }
                                  if resource_sample:
                                      item.update({"cpu_percent": columns[6], "memory_percent": columns[7], "rss_kb": columns[8]})
                                  processes.append(item)
                              event = {"timestamp_utc": utc_now(), "kind": "process_snapshot", "resource_sample": resource_sample, "truncated": truncated, "processes": processes}
                          except subprocess.TimeoutExpired:
                              probe_errors += 1
                              event = {"timestamp_utc": utc_now(), "kind": "probe_error", "reason": "ps_timeout"}
                          except (OSError, RuntimeError) as error:
                              probe_errors += 1
                              event = {"timestamp_utc": utc_now(), "kind": "probe_error", "reason": str(error)[:160]}
                          encoded = (json.dumps(event, sort_keys=True) + "\n").encode("utf-8")
                          try:
                              current_retained_bytes = retained_file_bytes()
                              provenance_path = run_dir / "canonical-provenance.json"
                              current_provenance_bytes = provenance_path.stat().st_size if provenance_path.exists() else 0
                              metadata_bytes = current_retained_bytes - output_bytes - current_provenance_bytes
                          except (OSError, RuntimeError) as error:
                              state, stop_reason = "incomplete", str(error)[:160]
                              break
                          if current_provenance_bytes > provenance_limit_bytes:
                              state, stop_reason = "incomplete", "canonical_provenance_limit_reached"
                              break
                          if metadata_bytes > metadata_limit_bytes:
                              state, stop_reason = "incomplete", "aggregate_metadata_limit_reached"
                              break
                          if output_bytes + len(encoded) > sample_limit_bytes or current_retained_bytes + len(encoded) + finalization_reserve_bytes > aggregate_limit_bytes:
                              state, stop_reason = "incomplete", "aggregate_sample_limit_reached"
                              break
                          samples.write(encoded.decode("utf-8"))
                          samples.flush()
                          output_bytes += len(encoded)
                          sample_count += 1
                          if resource_sample:
                              next_resource = now + resource_sample_interval_seconds
                          next_sample = now + process_table_interval_seconds
                      time.sleep(0.1)
          except Exception as error:
              state, stop_reason = "incomplete", "observer_exception_" + type(error).__name__

          write_json(
              run_dir / "observer-status.json",
              {
                  "schema_version": 1, "state": state, "stop_reason": stop_reason,
                  "gate_marker_observed": gate_marker_observed, "gate_state": gate_state,
                  "modules_gate_first_observed_at_utc": gate_first_observed_at_utc,
                  "modules_gate_completion_observed_at_utc": gate_completed_observed_at_utc,
                  "gate_exit_code": gate_exit_code, "gate_marker_error": gate_marker_error,
                  "process_sample_count": sample_count, "probe_error_count": probe_errors,
                  "process_sample_bytes": output_bytes, "finalized_at_utc": utc_now(),
                  "aggregate_retained_limit_bytes": aggregate_limit_bytes,
                  "metadata_output_limit_bytes": metadata_limit_bytes,
                  "canonical_provenance_limit_bytes": provenance_limit_bytes,
                  "sample_output_limit_bytes": sample_limit_bytes,
                  "finalization_reserve_bytes": finalization_reserve_bytes,
                  "termination": "not_reported_until_owner_waits_for_direct_child",
              },
          )
          sys.exit(0)
          PY_LIFECYCLE
              lifecycle_sampler_pid=$!
            else
              lifecycle_enabled="false"
              trap - EXIT TERM INT HUP
              printf '::warning::Lifecycle evidence directory could not be created; canonical verification will continue.\n'
            fi
          fi

          Scripts/pokedex-release-verification &
          verifier_pid=$!
          if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ]; then
            if printf '{"token":"%s","verifier_pid":%s}\n' "$lifecycle_token" "$verifier_pid" > "$lifecycle_dir/verification-start.json.tmp" && mv "$lifecycle_dir/verification-start.json.tmp" "$lifecycle_dir/verification-start.json"; then
              :
            else
              printf '::warning::Lifecycle invocation start record could not be published; capture may be incomplete.\n'
            fi
          fi
          python3 Scripts/capture_enumeration_xcresult.py "$PIKADEX_RELEASE_BUILD_ROOT" \
            --watch-verifier-pid "$verifier_pid" \
            --wait-timeout-seconds 7200 \
            --max-files 10000 \
            --max-bytes 536870912 \
            --copy-timeout-seconds 45 &
          observer_pid=$!
          wait "$verifier_pid"
          verifier_status=$?
          if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ]; then
            write_completion "verifier_completed"
          fi
          wait "$observer_pid"
          observer_status=$?
          if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ]; then
            write_observer_completion "observer_completed"
          fi
          if [ "$observer_status" -ne 0 ]; then
            printf '::error::Enumeration result observer failed with status %s; canonical verifier status is %s\n' "$observer_status" "$verifier_status"
          fi

          if [ "$lifecycle_enabled" = "true" ] && [ -n "$lifecycle_sampler_pid" ]; then
            provenance_path="$PIKADEX_RELEASE_BUILD_ROOT/evidence/provenance.json"
            if [ -f "$provenance_path" ] && [ ! -L "$provenance_path" ]; then
              provenance_bytes="$(wc -c < "$provenance_path" | tr -d '[:space:]')"
              case "$provenance_bytes" in
                ''|*[!0-9]*) provenance_bytes=1048577 ;;
              esac
              if [ "$provenance_bytes" -le "$provenance_limit_bytes" ]; then
                cp "$provenance_path" "$lifecycle_dir/canonical-provenance.json"
              else
                printf '{"state":"omitted","reason":"canonical_provenance_over_limit","bytes":%s,"limit_bytes":%s}\n' "$provenance_bytes" "$provenance_limit_bytes" > "$lifecycle_dir/canonical-provenance-status.json"
              fi
            else
              printf '{"state":"omitted","reason":"canonical_provenance_missing_or_symlinked"}\n' > "$lifecycle_dir/canonical-provenance-status.json"
            fi
            finalize_lifecycle_sampler
          fi
          exit "$verifier_status"

      # Run this before any simulator restart. The canonical verifier's exit code remains the gate.
      - name: Capture hosted simulator diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          DIAGNOSTIC_WINDOW_MINUTES: "60"
        shell: bash
        run: |
          set +e
          set -o pipefail
          build_root="${RUNNER_TEMP}/PikaDex-A2"
          evidence_dir="${build_root}/evidence"
          diagnostics_dir="${evidence_dir}/hosted-simulator-diagnostics"
          status_file="${diagnostics_dir}/collection-status.txt"
          if [ -L "$build_root" ] || [ -L "$evidence_dir" ] || [ -L "$diagnostics_dir" ]; then
            printf '::error::Refusing symlinked simulator diagnostic paths\n'
            exit 1
          fi
          if ! mkdir -p "$diagnostics_dir"; then
            printf '::error::Could not create simulator diagnostic directory\n'
            exit 1
          fi
          if [ -L "$evidence_dir" ] || [ -L "$diagnostics_dir" ] || [ -e "$status_file" ] || [ -L "$status_file" ]; then
            printf '::error::Refusing unsafe or pre-existing simulator diagnostic status path\n'
            exit 1
          fi
          if ! (
            set -o noclobber
            {
              printf 'collection_started_at_utc=%s\n' "$(/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')"
              printf 'workflow_run_id=%s\n' "${GITHUB_RUN_ID:-unknown}"
              printf 'workflow_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT:-unknown}"
              printf 'workflow_sha=%s\n' "${GITHUB_SHA:-unknown}"
              printf 'checkout_commit=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf unavailable)"
              printf 'checkout_tree=%s\n' "$(git rev-parse 'HEAD^{tree}' 2>/dev/null || printf unavailable)"
              printf 'log_window_minutes=%s\n' "$DIAGNOSTIC_WINDOW_MINUTES"
            } > "$status_file"
          ); then
            printf '::error::Could not safely initialize simulator diagnostic status\n'
            exit 1
          fi

          # Publish the copy staged by the concurrent enumeration observer.
          python3 Scripts/capture_enumeration_xcresult.py "$build_root" \
            --publish-staged

          capture() {
            local label="$1"
            local timeout_seconds="$2"
            local max_bytes="$3"
            shift 3
            local output_path="${diagnostics_dir}/${label}.log"
            local captured_at header_bytes payload_limit command_status reader_status bytes outcome
            local -a pipeline_statuses

            captured_at="$(/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf 'captured_at_utc=%s\ntimeout_seconds=%s\n' "$captured_at" "$timeout_seconds" > "$output_path"
            header_bytes="$(wc -c < "$output_path" | tr -d '[:space:]')"
            payload_limit=$((max_bytes - header_bytes))
            /usr/bin/perl -e 'alarm shift; exec @ARGV' "$timeout_seconds" "$@" 2>&1 |
              LC_ALL=C /usr/bin/awk -v limit="$payload_limit" '
                {
                  record = $0 ORS
                  available = limit - written
                  if (available > 0) {
                    if (length(record) > available) {
                      printf "%s", substr(record, 1, available)
                      written += available
                    } else {
                      printf "%s", record
                      written += length(record)
                    }
                  }
                }
              ' >> "$output_path"
            pipeline_statuses=( "${PIPESTATUS[@]}" )
            command_status="${pipeline_statuses[0]}"
            reader_status="${pipeline_statuses[1]}"
            bytes="$(wc -c < "$output_path" | tr -d '[:space:]')"

            if [ "$bytes" -ge "$max_bytes" ]; then
              outcome="output_limit_reached"
            elif [ "$command_status" -eq 142 ]; then
              outcome="timed_out"
            elif [ "$command_status" -ne 0 ] || [ "$reader_status" -ne 0 ]; then
              outcome="command_failed"
            else
              outcome="complete"
            fi

            printf '%s\t%s\tcommand_status=%s\treader_status=%s\tbytes=%s\n' "$label" "$outcome" "$command_status" "$reader_status" "$bytes" >> "$status_file"
            if [ "$outcome" != "complete" ]; then
              printf '::warning::Simulator diagnostic %s: %s (command status %s, reader status %s, %s bytes)\n' "$label" "$outcome" "$command_status" "$reader_status" "$bytes"
            fi
          }

          capture simulator-devices 20 2097152 xcrun simctl list devices --json
          capture related-processes 15 524288 /bin/bash -c "ps -A -o pid,ppid,state,etime,%cpu,%mem,comm | /usr/bin/awk 'NR == 1 || /xctest|testmanagerd|Simulator|CoreSimulator|xcodebuild|simctl|Pokedex|Modules|DatabasePipelineTests/'"
          capture disk-usage 15 65536 df -h "$RUNNER_TEMP" "$HOME"
          capture memory-state 15 65536 /bin/bash -c 'vm_stat; memory_pressure'
          lifecycle_status="${RUNNER_TEMP}/PikaDex-Simulator-Lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/observer-status.json"
          log_start_epoch=""
          log_end_epoch=""
          log_query_mode="last_60_minutes_fallback"
          if [ -f "$lifecycle_status" ] && [ ! -L "$lifecycle_status" ]; then
            log_bounds="$(python3 - "$lifecycle_status" <<'PY_LOG_WINDOW'
          import datetime
          import json
          import pathlib
          import sys

          def parse(value):
              if not isinstance(value, str):
                  return None
              try:
                  parsed = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      return None
                  return parsed.astimezone(datetime.timezone.utc)
              except (TypeError, ValueError):
                  return None

          try:
              status = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit(1)
          start = parse(status.get("modules_gate_first_observed_at_utc"))
          end = parse(status.get("modules_gate_completion_observed_at_utc"))
          if start is None:
              raise SystemExit(1)
          if end is None:
              end = start + datetime.timedelta(seconds=300)
          end = min(max(end, start), start + datetime.timedelta(seconds=300))
          start = max(datetime.datetime.fromtimestamp(0, datetime.timezone.utc), start - datetime.timedelta(seconds=30))
          end += datetime.timedelta(seconds=30)
          print(f"{int(start.timestamp())}\t{int(end.timestamp())}")
          PY_LOG_WINDOW
            )"
            log_bounds_status=$?
            if [ "$log_bounds_status" -eq 0 ]; then
              IFS=$'\t' read -r log_start_epoch log_end_epoch <<< "$log_bounds"
              case "${log_start_epoch}:${log_end_epoch}" in
                *[!0-9:]*|:*|*:) log_start_epoch=""; log_end_epoch="" ;;
                *) log_query_mode="modules_enumeration_window" ;;
              esac
            fi
          fi
          printf 'unified_log_query_mode=%s\nunified_log_start_epoch=%s\nunified_log_end_epoch=%s\nunified_log_levels=default,info,debug\n' "$log_query_mode" "${log_start_epoch:-unavailable}" "${log_end_epoch:-unavailable}" >> "$status_file"
          unified_log_predicate='process == "xctest" OR process == "testmanagerd" OR process == "xcodebuild" OR process == "launchd_sim" OR process CONTAINS[c] "Simulator" OR process CONTAINS[c] "Pokedex" OR process == "Modules" OR process == "DatabasePipelineTests" OR process == "PokedexConcurrencyTests"'
          if [ "$log_query_mode" = "modules_enumeration_window" ]; then
            capture unified-log 45 8388608 log show --start "@${log_start_epoch}" --end "@${log_end_epoch}" --info --debug --style compact --predicate "$unified_log_predicate"
          else
            capture unified-log 45 8388608 log show --last "${DIAGNOSTIC_WINDOW_MINUTES}m" --info --debug --style compact --predicate "$unified_log_predicate"
          fi

          # Copy recent reports only for XCTest and simulator processes.
          crash_source="${HOME}/Library/Logs/DiagnosticReports"
          crash_dir="${diagnostics_dir}/crash-reports"
          crash_candidates="${diagnostics_dir}/crash-report-candidates.txt"
          mkdir -p "$crash_dir"
          copied_reports=0
          copied_bytes=0
          if [ -d "$crash_source" ]; then
            if find "$crash_source" -maxdepth 1 -type f -mmin "-${DIAGNOSTIC_WINDOW_MINUTES}" \( \
              -iname '*xctest*.ips' -o -iname '*xctest*.crash' \
              -o -iname '*testmanagerd*.ips' -o -iname '*testmanagerd*.crash' \
              -o -iname '*simulator*.ips' -o -iname '*simulator*.crash' \
              -o -iname '*coresimulator*.ips' -o -iname '*coresimulator*.crash' \
              -o -iname '*pokedex*.ips' -o -iname '*pokedex*.crash' \
              -o -iname '*modules*.ips' -o -iname '*modules*.crash' \
              -o -iname '*databasepipelines*.ips' -o -iname '*databasepipelines*.crash' \
              -o -iname '*pokedexconcurrencytests*.ips' -o -iname '*pokedexconcurrencytests*.crash' \
            \) -print 2>/dev/null | LC_ALL=C /usr/bin/awk 'NR <= 20 { sub(/^.*\//, ""); print }' > "$crash_candidates"; then
              while IFS= read -r report_name; do
                [ -n "$report_name" ] || continue
                report="${crash_source}/${report_name}"
                if [ "$copied_reports" -ge 8 ]; then
                  printf 'crash_report_copy_limit_reached=8\n' >> "$status_file"
                  break
                fi
                report_bytes="$(wc -c < "$report" | tr -d '[:space:]')"
                if [ "$report_bytes" -gt 2097152 ]; then
                  printf 'crash_report_skipped=%s reason=over_2097152_bytes bytes=%s\n' "$report_name" "$report_bytes" >> "$status_file"
                  printf '::warning::Skipping simulator crash report over 2 MiB: %s\n' "$report_name"
                  continue
                fi
                if [ "$((copied_bytes + report_bytes))" -gt 8388608 ]; then
                  printf 'crash_report_skipped=%s reason=total_copy_limit bytes=%s\n' "$report_name" "$report_bytes" >> "$status_file"
                  continue
                fi
                if cp "$report" "${crash_dir}/${report_name}"; then
                  copied_reports=$((copied_reports + 1))
                  copied_bytes=$((copied_bytes + report_bytes))
                  printf 'crash_report_copied=%s bytes=%s\n' "$report_name" "$report_bytes" >> "$status_file"
                else
                  printf 'crash_report_copy_failed=%s\n' "$report_name" >> "$status_file"
                  printf '::warning::Could not copy simulator crash report: %s\n' "$report_name"
                fi
              done < "$crash_candidates"
            else
              printf 'crash_report_discovery=failed\n' >> "$status_file"
              printf '::warning::Could not scan recent simulator crash reports\n'
            fi
          else
            printf 'crash_report_directory=missing\n' >> "$status_file"
          fi
          printf 'crash_reports_copied=%s total_bytes=%s\n' "$copied_reports" "$copied_bytes" >> "$status_file"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pikadex-a2-verification
          path: ${{ runner.temp }}/PikaDex-A2/evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator lifecycle evidence
        if: ${{ always() && inputs.simulator_lifecycle_diagnostics == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pikadex-simulator-lifecycle
          path: ${{ runner.temp }}/PikaDex-Simulator-Lifecycle-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
